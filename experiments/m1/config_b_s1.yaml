# M2 run B, seed 1 (PLAN.md M2): the M1 recipe (config_s1.yaml) plus Rubric Dropout at 50%.
# Expectation: PROGRESS.md Notes 2026-09-27. Dropout: arXiv 2608.11669, one mask per prompt
# group and step, at least 3 criteria kept; eval grading always uses the full rubric.
run_name: m2-b-qwen1.5b-s1
model: Qwen/Qwen2.5-1.5B-Instruct
lora: false
seed: 1
split_seed: 0                # same 500 train / 100 eval prompts as the dry run

# data (data.py): seeded split of RubricHub medical by prompt
n_train: 500
n_eval: 100

# GRPO (TRL GRPOTrainer, vLLM colocated on GPU 0)
max_steps: 600
lr: 1.0e-6
prompts_per_step: 8
num_generations: 8
micro_batch_size: 2
max_completion_length: 768
temperature: 1.0
beta: 0.0
loss_type: dapo
rubric_dropout: 0.5          # fraction of criteria dropped from the training reward
rubric_dropout_min_keep: 3
vllm_gpu_memory_utilization: 0.30
vllm_max_model_length: 2048
gradient_checkpointing: true
save_every: 50               # weights only; every checkpoint kept (M4 needs the whole run)
checkpoint_dir: ~/rolloutscope-ckpt   # local disk; copied to the run directory afterwards

# evaluation: every eval_every (K) steps, and once before training
eval_every: 25

# stop rule for proxy judge failures (train.py exits with code 3)
judge_max_failure_rate: 0.10
judge_failure_patience: 3
